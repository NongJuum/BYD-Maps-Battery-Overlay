name: Android Beta APK

on:
  push:
    branches:
      - beta
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Validate signing secrets
        shell: bash
        env:
          ALPHA_KEYSTORE_BASE64: ${{ secrets.ALPHA_KEYSTORE_BASE64 }}
          ALPHA_KEYSTORE_PASSWORD: ${{ secrets.ALPHA_KEYSTORE_PASSWORD }}
          ALPHA_KEY_ALIAS: ${{ secrets.ALPHA_KEY_ALIAS }}
          ALPHA_KEY_PASSWORD: ${{ secrets.ALPHA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ALPHA_KEYSTORE_BASE64 ALPHA_KEYSTORE_PASSWORD ALPHA_KEY_ALIAS ALPHA_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          mkdir -p "$RUNNER_TEMP/beta-signing"
          printf '%s' "$ALPHA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/beta-signing/beta-release.jks"
          test -s "$RUNNER_TEMP/beta-signing/beta-release.jks"

      - name: Assemble Beta APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Sign and verify Beta APK
        shell: bash
        env:
          ALPHA_KEYSTORE_BASE64: ${{ secrets.ALPHA_KEYSTORE_BASE64 }}
          ALPHA_KEYSTORE_PASSWORD: ${{ secrets.ALPHA_KEYSTORE_PASSWORD }}
          ALPHA_KEY_ALIAS: ${{ secrets.ALPHA_KEY_ALIAS }}
          ALPHA_KEY_PASSWORD: ${{ secrets.ALPHA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/beta-signing/beta-release.jks" \
            --ks-pass env:ALPHA_KEYSTORE_PASSWORD \
            --key-pass env:ALPHA_KEY_PASSWORD \
            --ks-key-alias "$ALPHA_KEY_ALIAS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --out "${APK}.signed" "$APK"
          mv "${APK}.signed" "$APK"
          cp "$APK" BYD-Maps-Battery-Overlay-Beta.apk
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Upload Beta APK
        uses: actions/upload-artifact@v4
        with:
          name: BYD-Maps-Battery-Overlay-Beta
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            BYD-Maps-Battery-Overlay-Beta.apk
          if-no-files-found: error

      - name: Create GitHub Beta prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-v1.0.0
          name: BYD Maps Battery Overlay Beta v1.0.0
          target_commitish: beta
          prerelease: true
          generate_release_notes: true
          files: BYD-Maps-Battery-Overlay-Beta.apk

      - name: Prepare OTA metadata after successful signed build
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE="$(sed -nE "s/^[[:space:]]*versionCode ([0-9]+)$/\\1/p" app/build.gradle)"
          VERSION_NAME="$(sed -nE "s/^[[:space:]]*versionName '([^']+)'$/\\1/p" app/build.gradle)"
          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"
          cat > version.json <<EOF
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "channel": "beta",
            "edition": "Beta",
            "apkUrl": "https://raw.githubusercontent.com/NongJuum/BYD-Maps-Battery-Overlay/beta/BYD-Maps-Battery-Overlay-Beta.apk",
            "changelogTh": "แก้ OTA ให้ติดตั้งแยกจาก process ของแอป พร้อมตรวจพื้นที่และรายงานข้อผิดพลาดจริง",
            "changelogEn": "Detached OTA installation, head-unit storage check and real Package Manager error reporting."
          }
          EOF

      - name: Publish Beta APK and OTA metadata to beta branch
        if: github.ref == 'refs/heads/beta' && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BYD-Maps-Battery-Overlay-Beta.apk version.json
          git commit -m "chore(beta): publish signed APK and OTA metadata [skip ci]"
          git push origin HEAD:beta
