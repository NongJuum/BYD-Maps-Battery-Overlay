name: Android Beta APK

on:
  push:
    branches:
      - beta
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble Beta APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify Android 10 compatible APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -s "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          cp "$APK" BYD-Maps-Battery-Overlay-Beta.apk

      - name: Upload Beta APK
        uses: actions/upload-artifact@v4
        with:
          name: BYD-Maps-Battery-Overlay-Beta
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            BYD-Maps-Battery-Overlay-Beta.apk
          if-no-files-found: error

      - name: Prepare OTA metadata after successful signed build
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/update_version_json.py

      - name: Publish Beta APK and OTA metadata to beta branch
        if: github.ref == 'refs/heads/beta' && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BYD-Maps-Battery-Overlay-Beta.apk version.json
          git commit -m "chore(beta): publish signed APK and OTA metadata [skip ci]"
          git push origin HEAD:beta
