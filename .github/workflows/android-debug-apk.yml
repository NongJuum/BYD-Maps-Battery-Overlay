name: Android debug APK

on:
  push:
    branches:
      - fix/byd-native-api-diagnostics
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Enforce and verify v1 + v2 APK signatures
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          mkdir -p "$HOME/.android"
          test -f "$HOME/.android/debug.keystore"
          for APK in app/build/outputs/apk/debug/app-debug.apk BYD-Maps-Battery-Overlay-Universal.apk; do
            "$APKSIGNER" sign \
              --ks "$HOME/.android/debug.keystore" \
              --ks-pass pass:android \
              --key-pass pass:android \
              --ks-key-alias androiddebugkey \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --out "${APK}.signed" "$APK"
            mv "${APK}.signed" "$APK"
            "$APKSIGNER" verify --verbose --print-certs "$APK"
          done
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BYD-Maps-Battery-Overlay-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            BYD-Maps-Battery-Overlay-Universal.apk
          if-no-files-found: error
