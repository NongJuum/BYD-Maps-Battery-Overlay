plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.byd.mapsoverlay'
    compileSdk 34

    defaultConfig {
        applicationId 'com.byd.mapsoverlay'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE*',
                'META-INF/license*',
                'META-INF/NOTICE*',
                'META-INF/notice*',
                'META-INF/ASL2.0',
                'META-INF/*.kotlin_module',
                'META-INF/versions/9/OSGI-INF/MANIFEST.MF',
                'META-INF/AL2.0',
                'META-INF/LGPL2.1'
            ]
        }
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'dev.mobile:dadb:1.2.6'
}

afterEvaluate {
    tasks.register('copyApkToRoot') {
        doLast {
            def apkFile = file("${layout.buildDirectory.get()}/outputs/apk/debug/app-debug.apk")
            if (apkFile.exists()) {
                copy {
                    from apkFile
                    into rootProject.projectDir
                    rename { 'BYD-Maps-Battery-Overlay-Universal.apk' }
                }
                println "✅ Copied Universal APK to: ${rootProject.projectDir}/BYD-Maps-Battery-Overlay-Universal.apk"
            }
        }
    }

    tasks.named('assembleDebug').configure {
        finalizedBy 'copyApkToRoot'
    }
}
