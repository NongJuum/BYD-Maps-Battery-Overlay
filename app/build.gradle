plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.byd.mapsoverlay'
    compileSdk 34

    defaultConfig {
        applicationId 'com.byd.mapsoverlay.alpha'
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName '1.0.2-alpha'
    }

    signingConfigs {
        debug {
            // Some vendor IVI package installers only accept legacy JAR (v1)
            // signatures. Keep modern APK signing too for Android 7+.
            enableV1Signing true
            enableV2Signing true
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE*',
                'META-INF/license*',
                'META-INF/NOTICE*',
                'META-INF/notice*',
                'META-INF/ASL2.0',
                'META-INF/*.kotlin_module',
                'META-INF/versions/9/OSGI-INF/MANIFEST.MF',
                'META-INF/AL2.0',
                'META-INF/LGPL2.1'
            ]
        }
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

// Build the OEM listener declaration as a compile-only jar. It must NOT be
// packaged: on the head unit the class is supplied by BYD's installed SDK.
tasks.register('compileBydSdkStubs', JavaCompile) {
    source = fileTree('stubs-bydauto') { include '**/*.java' }
    destinationDirectory = layout.buildDirectory.dir('byd-sdk-stubs/classes')
    classpath = files()
    options.release = 8
}
tasks.register('packageBydSdkStubs', Jar) {
    dependsOn tasks.named('compileBydSdkStubs')
    archiveFileName = 'bydauto-stubs.jar'
    destinationDirectory = layout.buildDirectory.dir('byd-sdk-stubs')
    from(layout.buildDirectory.dir('byd-sdk-stubs/classes'))
}

configurations {
    bydSdkCompileOnly
}

dependencies {
    compileOnly files(layout.buildDirectory.file('byd-sdk-stubs/bydauto-stubs.jar'))
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'dev.mobile:dadb:1.2.8'
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('packageBydSdkStubs')
}

afterEvaluate {
    tasks.register('copyApkToRoot') {
        doLast {
            def apkFile = file("${layout.buildDirectory.get()}/outputs/apk/debug/app-debug.apk")
            if (apkFile.exists()) {
                copy {
                    from apkFile
                    into rootProject.projectDir
                    rename { 'BYD-Maps-Battery-Overlay-Universal.apk' }
                }
                copy {
                    from apkFile
                    into rootProject.projectDir
                    rename { 'BYD-Maps-Battery-Overlay-Alpha.apk' }
                }
                println "✅ Copied Universal APK to: ${rootProject.projectDir}/BYD-Maps-Battery-Overlay-Universal.apk"
                println "✅ Copied Alpha APK to: ${rootProject.projectDir}/BYD-Maps-Battery-Overlay-Alpha.apk"
            }
        }
    }

    tasks.named('assembleDebug').configure {
        finalizedBy 'copyApkToRoot'
    }
}
